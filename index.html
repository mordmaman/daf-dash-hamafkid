<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daf Dash: HaMafkid</title>
<meta name="description" content="Revision games for Bava Metzia, Perek HaMafkid (33b–36a): vocab and the sugya.">
<meta name="theme-color" content="#0f1830">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1830;--bg2:#16223f;--card:#1d2c52;--card2:#263a69;--ink:#f6f1e4;--muted:#a3b3d6;--gold:#f5c451;--green:#48d39a;--red:#ff6f6f;--blue:#6fb1ff;--pink:#ff8fc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#24376b 0,var(--bg) 60%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:540px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3,.disp{font-family:Fredoka,system-ui,sans-serif;margin:0}
.he{font-family:"Frank Ruhl Libre","Times New Roman",serif;direction:rtl;unicode-bidi:isolate;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:44px}
.top h2{flex:1;font-size:20px}
.back{width:42px;height:42px;border-radius:12px;background:var(--card);font-size:20px}
.pill{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.hero{text-align:center;padding:14px 0 6px}
.hero h1{font-size:40px;letter-spacing:.5px;color:var(--gold);text-shadow:0 3px 0 #0008}
.hero .sub{color:var(--muted);font-size:14px}
.hero .he{font-size:26px;display:block;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:Fredoka;font-size:20px;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:10px;background:#0006;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px;transition:width .4s}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;background:#0004;border:2px solid transparent;font-weight:600;font-size:14px}
.chip.on{background:var(--gold);color:#221a00}
.sec{font-family:Fredoka;font-size:18px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:linear-gradient(160deg,var(--card2),var(--card));border-radius:18px;padding:14px 12px;text-align:left;min-height:108px;position:relative;box-shadow:0 4px 0 #0005;transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 #0005}
.mode .ic{font-size:30px;line-height:1}
.mode b{display:block;font-family:Fredoka;font-size:17px;margin-top:6px}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.25;display:block}
.mode .st{position:absolute;top:10px;right:10px;font-size:12px;letter-spacing:1px}
.mode.wide{grid-column:1/-1;min-height:0;background:linear-gradient(120deg,#6b4a12,#3a2a5e)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--gold);color:#221a00;font-family:Fredoka;font-weight:600;font-size:18px;box-shadow:0 4px 0 #9a7412;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a7412}
.btn.alt{background:var(--card2);color:var(--ink);box-shadow:0 4px 0 #0006}
.btn.red{background:var(--red);box-shadow:0 4px 0 #9a3030;color:#2a0000}
.btn.green{background:var(--green);box-shadow:0 4px 0 #1f7d58;color:#00281a}
.row{display:flex;gap:10px}.row>*{flex:1}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1}
.q{background:var(--card);border-radius:18px;padding:18px 16px;text-align:center;font-size:18px;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.q.he,.q .he{font-size:34px;line-height:1.35}
.q .tag{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.06em}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{background:var(--card2);border-radius:14px;padding:13px 14px;text-align:left;font-size:16px;border:2px solid transparent;box-shadow:0 3px 0 #0005}
.opt.he{font-size:24px;text-align:right}
.opt.ok{background:#1e6b4f;border-color:var(--green)}
.opt.no{background:#6d2a34;border-color:var(--red)}
.opt:disabled{cursor:default}
.why{background:#0005;border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.center{text-align:center}.muted{color:var(--muted)}.big{font-size:56px;line-height:1.1}
.stars{font-size:44px;letter-spacing:6px}
.miss{background:#0004;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px;text-align:left}
.miss b{color:var(--green)}

.arena{position:relative;height:56vh;min-height:330px;background:linear-gradient(#0a1226,#16264d);border-radius:18px;overflow:hidden;touch-action:manipulation}
.arena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 12px,#0000 12px 20px)}
.tile{position:absolute;top:0;width:31%;padding:10px 6px;border-radius:14px;background:var(--card2);border:2px solid #fff3;text-align:center;font-size:14.5px;line-height:1.2;box-shadow:0 4px 10px #0007;will-change:transform;user-select:none}
.tile.he{font-size:21px}
.tile.ok{background:#1e6b4f;border-color:var(--green)}.tile.no{background:#6d2a34;border-color:var(--red);opacity:.5}
.hud{display:flex;justify-content:space-between;align-items:center;margin:8px 2px;font-family:Fredoka;font-size:18px}
/* flash */
.fc{height:300px;border-radius:22px;background:linear-gradient(160deg,#2b4079,#1d2c52);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 8px 0 #0006;touch-action:pan-y;user-select:none;transition:transform .15s,background .15s}
.fc .he{font-size:42px;line-height:1.3}.fc .en{font-size:22px;color:var(--gold);margin-top:14px;font-weight:600}
.fc .hint{font-size:13px;color:var(--muted);margin-top:16px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{aspect-ratio:1/1;border-radius:14px;background:linear-gradient(160deg,#3a55a0,#263a69);display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:13px;line-height:1.15;box-shadow:0 3px 0 #0006;overflow:hidden}
.mc.down{font-size:30px;color:#fff5}
.mc.up{background:var(--ink);color:#1a1a2a}.mc.up.he{font-size:20px}
.mc.done{background:#1e6b4f;color:var(--ink);opacity:.75}
/* build */
.slot{min-height:74px;background:#0005;border:2px dashed #fff3;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin-top:12px;min-height:60px}
.pc{background:var(--card2);padding:9px 13px;border-radius:12px;font-size:23px;box-shadow:0 3px 0 #0006}
.slot .pc{background:var(--gold);color:#221a00}
/* cow */
.field{position:relative;height:150px;background:linear-gradient(#27407c 0 60%,#2d6b46 60%);border-radius:18px;overflow:hidden}
.who{position:absolute;bottom:14px;text-align:center;font-size:12px;font-weight:700}.who span{font-size:40px;display:block}
.who.l{left:8%}.who.r{right:8%}
.cow{position:absolute;bottom:22px;font-size:44px;left:12%;transition:left .7s cubic-bezier(.5,1.6,.5,1),transform .5s}
.list .w{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #fff1}
.list .w .he{font-size:21px;flex:0 0 auto;max-width:55%}
.list .w span{font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff3;margin-left:2px}.dot.f{background:var(--green)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

{d:'35a',q:'The creditor who got the field sold it to someone else. Can the debtor still get it back by paying?',o:['No — the buyer came for land, not for money','Yes, always','Yes, within twelve months','Only if the buyer agrees to swear'],y:'זַבְּנַהּ, אוֹרְתַהּ, וְיַהֲבַהּ בְּמַתָּנָה — אַדַּעְתָּא דְּאַרְעָא נְחוּת.'},
{d:'35b',q:'A debtor handed over his field for his debt by himself, without bet din. Rav Acha and Ravina argue whether he can get it back. What is the reason of the one who says he CAN?',o:['He only did it out of embarrassment, so it is not a real sale','Bet din made a mistake','Land always goes back','He paid too much'],y:'מֵחֲמַת כִּיסּוּפָא הוּא דְּאַגְבְּיֵהּ. The other opinion: he did it of his own free will, so it is זְבִינֵי מְעַלְּיָא.'},
{d:'35b',q:'From when does the creditor eat the produce of the seized field, according to Rava?',o:['From when the days of announcement are over','From when the adrachta reaches his hand','From when the witnesses sign','From the day of the loan'],y:'Rabba: when the adrachta reaches him. Abaye: the witnesses\' signatures acquire it for him. Rava: מִכִּי שְׁלִימוּ יְמֵי אַכְרַזְתָּא.'},
{d:'35b',q:'Shimon rents a cow from Reuven and lends it to Levi. It dies naturally at Levi\'s. According to the Tanna Kamma, what happens?',o:['Shimon swears it died naturally, and Levi pays Shimon','Levi pays Reuven','Nobody pays','Shimon pays Reuven'],y:'יִשָּׁבַע הַשּׂוֹכֵר שֶׁמֵּתָה כְּדַרְכָּהּ, וְהַשּׁוֹאֵל יְשַׁלֵּם לַשּׂוֹכֵר. A renter is exempt for a natural death; a borrower is liable.'},
{d:'35b',q:'Same case. What does Rabbi Yosei say?',o:['The cow (its value) goes back to the owner','The renter keeps the payment','Nobody pays','The renter pays double'],y:'כֵּיצַד הַלָּה עוֹשֶׂה סְחוֹרָה בְּפָרָתוֹ שֶׁל חֲבֵירוֹ? אֶלָּא תַּחְזוֹר פָּרָה לַבְּעָלִים.'},
{d:'35b',q:'Can the owner say to the renter: "Forget you and your oath — I will deal with the borrower myself"?',o:['No — the renter acquired it at the moment of death; the oath is only to put the owner\'s mind at rest','Yes — the oath is what gives the renter the cow','Yes, if he pays the renter','Only according to Rabbi Yosei'],y:'Abaye: מִשְּׁעַת מִיתָה הוּא דְּקָנֵי, וּשְׁבוּעָה כְּדֵי לְהָפִיס דַּעְתּוֹ שֶׁל בַּעַל הַבַּיִת.'},
{d:'35b',q:'Rabbi Zeira\'s case: rented for 100 days, owner borrowed it back for 90, renter rented again for 80, owner borrowed again for 70 — and it died. How many cows does the owner owe?',o:['Four','One','Two','Three'],y:'For each borrowing he owes a cow, and he must still supply a cow for each rental (Rashi) — four in all.'},
{d:'35b',q:'Rav Acha of Difti objects: "It is just one cow going in and out!" What does Ravina answer?',o:['Is the cow still here, intact, for him to say that?','There were really four cows','Rabbi Zeira changed his mind','The owner was careless'],y:'וּמִי אִיתַהּ לְפָרָה בְּעֵינָא דְּנֵימָא לֵיהּ הָכִי? It is dead — he must pay what he took on.'},
{d:'35b',q:'What does Mar bar Rav Ashi say about Rabbi Zeira\'s case?',o:['Only two cows — one for borrowing (to keep) and one for renting (to use, then return)','Four cows','One cow','No cows — it is the owner\'s own animal'],y:'שׁוּם שְׁאֵלָה אַחַת הִיא וְשׁוּם שְׂכִירוּת אַחַת הִיא.'},
{d:'36a',q:'Which false oath brings an asham?',o:['One that denies money he owes','Any oath said out loud','One made in bet din','One about a cow'],y:'כְּפִירַת מָמוֹן — אָשָׁם. בִּיטּוּי שְׂפָתַיִם — חַטָּאת.'},
{d:'36a',q:'What is Rabbi Yirmeya coming to teach with his four cases?',o:['Not like Rabbi Ami, who says an oath that judges impose has no "shevuat bituy"','That a borrower is always liable','That a renter is like a paid guardian','That you must not swear at all'],y:'לְאַפּוֹקֵי מִדְּרַבִּי אַמֵּי — who learns from כִּי תִשָּׁבַע that it must be an oath he makes by himself.'},
{d:'36a',q:'A guardian handed the deposit to another guardian. Who says what?',o:['Rav: exempt. Rabbi Yochanan: liable','Rav: liable. Rabbi Yochanan: exempt','Both say exempt','Both say liable'],y:'אִתְּמַר: שׁוֹמֵר שֶׁמָּסַר לְשׁוֹמֵר, רַב אָמַר פָּטוּר, וְרַבִּי יוֹחָנָן אָמַר חַיָּיב.'},
{d:'36a',q:'A PAID guardian hands the deposit to an UNPAID guardian (worse guarding). According to Rav, why is he still exempt?',o:['He handed it to a sensible person','The owner agreed','He was paid less','He swore first'],y:'Abaye: even though גָּרוֹעֵי גָּרְעַהּ לִשְׁמִירָתוֹ — דְּהָא מְסָרָהּ לְבֶן דַּעַת.'},
{d:'36a',q:'An UNPAID guardian hands the deposit to a PAID guardian (better guarding). According to Rabbi Yochanan, why is he still liable?',o:['The owner says: "I do not want my deposit in someone else\'s hand"','A paid guardian is not trusted','He broke his oath','He made a profit'],y:'אֵין רְצוֹנִי שֶׁיְּהֵא פִּקְדוֹנִי בְּיַד אַחֵר.'},
{d:'36a',q:'The gardener went to the wedding and left the spades with the old woman. They were stolen and Rav exempted him. Why is that NOT proof that Rav holds a guardian who hands over is exempt?',o:['The gardeners themselves left their spades with that old woman every day','The old woman was paid','The gardener swore','Spades are not worth much'],y:'שָׁאנֵי הָתָם דְּכֹל יוֹמָא נָמֵי אִינְהוּ גּוּפַיְיהוּ גַּבַּהּ דְּהַהִיא סָבְתָּא הֲווֹ מַפְקְדִי — they cannot say "we do not want her".'},
{d:'36a',q:'Rabbi Abba bar Memel asks on Rabbi Yochanan from our Mishnah (the renter who lent the cow). How does Rabbi Ami answer?',o:['The owner gave the renter permission to lend it','The Mishnah is like Rav','The cow died before he lent it','The renter paid extra'],y:'הָכָא בְּמַאי עָסְקִינַן? בְּשֶׁנָּתְנוּ לוֹ רְשׁוּת הַבְּעָלִים לְהַשְׁאִיל.'},
{d:'36a',q:'"If the owner gave permission, the borrower should pay the OWNER!" What is the answer?',o:['The owner said "lend it as you see fit" — so the borrower is the renter\'s borrower','The owner forgave the debt','Rabbi Yosei disagrees','The borrower already swore'],y:'דַּאֲמַרוּ לֵיהּ: לְדַעְתָּךְ.'},
{d:'36a',q:'A Mishnah says: if he gave the coins to his SMALL children to guard, he is liable. What does Rami bar Chama work out from that?',o:['If he gave them to his grown-up children he is exempt — so why can the owner not say "I do not want it with someone else"?','Children can never be guardians','Coins must be buried in the ground','He is liable either way'],y:'טַעְמָא דִּקְטַנִּים, הָא גְּדוֹלִים — פָּטוּר. A question on Rabbi Yochanan. Rava\'s answer is on 36b…'},
];

/* Who said it? {d, s: statement, by: sage} */
const SAID = [
{d:'33b',s:'"But a person cannot transfer something that has not yet come into the world!"',by:'Rami bar Chama'},
{d:'34a',s:'"It is as if he said: when it is stolen and you choose to pay me, my cow is yours from now."',by:'Rava'},
{d:'34a',s:'"If so, even its shearings and its babies too!"',by:'Rabbi Zeira'},
{d:'34a',s:'"Paid" does not mean really paid — once he said "I am going to pay", that is enough.',by:'Rabbi Yochanan'},
{d:'34a',s:'An unpaid guardian who says "I was careless" gets the kefel, because he could have exempted himself with "it was stolen".',by:'Rav Papa'},
{d:'34a',s:'A borrower only gets the kefel once he actually pays — because all the benefit is his.',by:'Abaye'},
{d:'34b',s:'"We make him swear that it is not in his possession — maybe he set his eyes on it."',by:'Rav Huna'},
{d:'34b',s:'"Who swears?" is going on the first part of the Mishnah (the end of the first part).',by:'Shmuel'},
{d:'35a',s:'The Mishnah is where there are witnesses that it was stolen (and he might work hard and bring it).',by:'Rav Yosef'},
{d:'35a',s:'"This one swears and that one swears… the lender swears first."',by:'Rav Ashi'},
{d:'35a',s:'"Every \'I do not know\' is carelessness. Go and pay!"',by:'Rav Nachman'},
{d:'35a',s:'"I am from Nehardea, and I hold that seized property can always go back."',by:'Ameimar'},
{d:'35a',s:'"In Usha they decreed: a woman who sold her melog property… the husband takes it back from the buyers."',by:'Rabbi Yosei bar Chanina'},
{d:'35b',s:'He eats the produce from when the adrachta reaches his hand.',by:'Rabba'},
{d:'35b',s:'"How can this man do business with his friend\'s cow?"',by:'Rabbi Yosei'},
{d:'35b',s:'The renter acquires the cow from the moment of death; the oath is only to put the owner\'s mind at rest.',by:'Abaye'},
{d:'35b',s:'"Sometimes the owner pays several cows to the renter."',by:'Rabbi Zeira'},
{d:'35b',s:'"Is the cow still here, intact, for him to say that?"',by:'Ravina'},
{d:'35b',s:'"He only has two cows against him: one for borrowing and one for renting."',by:'Mar bar Rav Ashi'},
{d:'36a',s:'"Sometimes both bring a chatat, sometimes both bring an asham…"',by:'Rabbi Yirmeya'},
{d:'36a',s:'An oath that the judges make you swear has no liability for "shevuat bituy".',by:'Rabbi Ami'},
{d:'36a',s:'A guardian who handed over to a guardian is exempt.',by:'Rav'},
{d:'36a',s:'A guardian who handed over to a guardian is liable.',by:'Rabbi Yochanan'},
{d:'36a',s:'"That ruling of Rav was not said outright — it was worked out from the story of the gardeners."',by:'Rav Chisda'},
{d:'36a',s:'He challenged Rabbi Ami from our Mishnah: "Let the owner say — I do not want my deposit with someone else!"',by:'Rabbi Abba bar Memel'},
];
const SAGES = [...new Set(SAID.map(x=>x.by))];

/* Rabbi Yirmeya's grid (35b–36a) */
const KORBAN = [
{real:'died naturally',claim:'it was an accident (ones)',r:'Chatat',b:'Chatat',
 ry:'A renter is exempt either way, so his lie did not save him any money — a chatat.',by:'A borrower is liable either way, so his lie did not save him any money — a chatat.'},
{real:'was stolen',claim:'it died because of the work',r:'Asham',b:'Asham',
 ry:'A renter is liable for theft. He lied to get out of paying — denying money — an asham.',by:'A borrower is liable for theft but exempt for "died from work". He lied to get out of paying — an asham.'},
{real:'died naturally',claim:'it died because of the work',r:'Chatat',b:'Asham',
 ry:'A renter is exempt either way — no money denied — a chatat.',by:'A borrower is liable for a natural death, and tried to exempt himself with "died from work" — an asham.'},
{real:'was stolen',claim:'it died naturally',r:'Asham',b:'Chatat',
 ry:'A renter is liable for theft and loss, and tried to exempt himself with "died naturally" — an asham.',by:'A borrower is liable either way — no money denied — a chatat.'},
];
</script>

<script>
/* ============================ ENGINE ============================ */
(function(){
'use strict';
const app=document.getElementById('app');
const W=WORDS.map((a,i)=>({i,d:a[0],t:a[1],he:a[2],en:a[3],g:a[4]||''}));
const KEY='dafdash-hamafkid-v1';
const DEF={box:{},best:{},xp:0,streak:0,last:'',sound:true,dafs:DAFS.slice(),type:'all',dir:'he'};
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){const s=Object.assign({},DEF,j);s.dafs=(s.dafs||[]).filter(d=>DAFS.includes(d));if(!s.dafs.length)s.dafs=DAFS.slice();return s}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- helpers ---------- */
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v)}
 for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let cleanups=[];
function cleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
function later(fn,ms){const t=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(t));return t}
function screen(title,...nodes){cleanup();app.innerHTML='';
 if(title!=null)app.append(el('div',{class:'top'},el('button',{class:'back','aria-label':'Back',onclick:home},'←'),el('h2',{text:title}),el('span',{class:'pill',text:'⭐ '+S.xp})));
 app.append(...nodes.flat(Infinity).filter(Boolean));window.scrollTo(0,0)}
const box=w=>S.box[w.he]||0;
function mark(w,ok){if(!w)return;S.box[w.he]=ok?Math.min(3,box(w)+1):0;save()}
function active(){let a=W.filter(w=>S.dafs.includes(w.d));if(S.type!=='all')a=a.filter(w=>w.t===S.type);return a}
function inDaf(arr){return arr.filter(x=>S.dafs.includes(x.d))}
function pickWords(n){return shuffle(active()).sort((a,b)=>box(a)-box(b)+(Math.random()-.5)*1.6).slice(0,n)}
const rankTable=[[0,'Beginner'],[40,'Talmid'],[120,'Chaver'],[300,'Lamdan'],[600,'Masmid'],[1000,'Talmid Chacham']];
const rank=()=>rankTable.filter(r=>S.xp>=r[0]).pop()[1];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function touchStreak(){const t=today();if(S.last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak=(S.last===ys?S.streak:0)+1;S.last=t;save()}

/* ---------- sound ---------- */
let AC=null;
function beep(kind){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const seq={ok:[[660,.07],[880,.1]],no:[[200,.16]],win:[[523,.09],[659,.09],[784,.09],[1047,.18]],tap:[[440,.04]]}[kind]||[];let t=AC.currentTime;
 for(const [f,d] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='no'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d}}catch(e){}}

/* ---------- question makers ---------- */
function vocabQ(w,n,dir){n=n||4;dir=dir||S.dir;if(dir==='mix')dir=Math.random()<.5?'he':'en';
 const ok=x=>x!==w&&x.en!==w.en&&x.he!==w.he&&!(w.g&&x.g===w.g);
 const act=new Set(active());let pool=shuffle(W.filter(ok));const near=pool.filter(x=>act.has(x));if(near.length>=n-1)pool=near;
 const ds=[],seen=new Set();for(const x of pool){if(seen.has(x.en))continue;seen.add(x.en);ds.push(x);if(ds.length===n-1)break}
 const he=dir==='he';
 return {d:w.d,w,q:he?w.he:w.en,qHe:he,sub:he?'What does it mean?':'How does the Gemara say it?',
  opts:shuffle([w,...ds]).map(x=>({t:he?x.en:x.he,he:!he,ok:x===w})),ans:he?w.en:w.he,why:''}}
function caseQ(c){return {d:c.d,q:c.q,opts:shuffle(c.o.map((t,i)=>({t,ok:i===0}))),ans:c.o[0],why:c.y}}
function saidQ(x){const ds=shuffle(SAGES.filter(s=>s!==x.by)).slice(0,3);
 return {d:x.d,q:x.s,sub:'Who said it?',opts:shuffle([x.by,...ds]).map(t=>({t,ok:t===x.by})),ans:x.by,why:''}}
function korbanQs(){const qs=[];KORBAN.forEach(k=>{[['renter','r','ry'],['borrower','b','by']].forEach(([who,f,y])=>{
  qs.push({d:'36a',q:'The cow really '+k.real+'. Both swore that '+k.claim+'. What does the '+who.toUpperCase()+' bring?',opts:['Chatat','Asham'].map(t=>({t,ok:t===k[f]})),ans:k[f],why:k[y]})})});
 return shuffle(qs)}

/* ---------- HOME ---------- */
function stars(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n)}
function modeBtn(key,ic,name,desc,fn,wide){const b=S.best[key];
 return el('button',{class:'mode'+(wide?' wide':''),onclick:()=>{beep('tap');fn()}},el('span',{class:'st',text:b?stars(b.s):''}),el('div',{class:'ic',text:ic}),el('b',{text:name}),el('small',{text:desc+(b&&b.n!=null?' · best '+b.n:'')}))}
function home(){const all=W.length,mast=W.filter(w=>box(w)>=2).length,act=active();
 const chips=el('div',{class:'chips'},DAFS.map(d=>el('button',{class:'chip'+(S.dafs.includes(d)?' on':''),text:d,onclick:()=>{const i=S.dafs.indexOf(d);if(i>=0){if(S.dafs.length>1)S.dafs.splice(i,1)}else S.dafs.push(d);save();home()}})),
   el('button',{class:'chip',text:'All',onclick:()=>{S.dafs=DAFS.slice();save();home()}}));
 const seg=(lab,key,opts)=>[el('div',{class:'lbl',text:lab}),el('div',{class:'chips'},opts.map(([v,t])=>el('button',{class:'chip'+(S[key]===v?' on':''),text:t,onclick:()=>{S[key]=v;save();home()}})))];
 screen(null,
  el('div',{class:'hero'},el('h1',{text:'Daf Dash'}),el('span',{class:'he',text:'הַמַּפְקִיד'}),el('div',{class:'sub',text:'Bava Metzia · Perek 3 · '+DAFS[0]+'–'+DAFS[DAFS.length-1]})),
  el('div',{class:'stats'},
   el('div',{class:'stat'},el('b',{text:'⭐ '+S.xp}),el('span',{text:rank()})),
   el('div',{class:'stat'},el('b',{text:'🔥 '+S.streak}),el('span',{text:'day streak'})),
   el('div',{class:'stat'},el('b',{text:mast+'/'+all}),el('span',{text:'words known'}))),
  el('div',{class:'bar'},el('i',{style:'width:'+Math.round(100*mast/all)+'%'})),
  el('div',{class:'card'},
   el('div',{class:'lbl',style:'margin-top:0',text:'Which dapim? ('+act.length+' words)'}),chips,
   seg('Which words?','type',[['all','All'],['k','Key Gemara words'],['s','Sugya words']]),
   seg('Ask me','dir',[['he','Aramaic → English'],['en','English → Aramaic'],['mix','Mix']])),
  el('div',{class:'sec',text:'📚 Words'}),
  el('div',{class:'grid'},
   modeBtn('rain','🌧️','Word Rain','Tap the right meaning before it lands',rain),
   modeBtn('speed','⚡','Speed Round','60 seconds. How many?',speed),
   modeBtn('flash','🃏','Flashcards','Swipe: know it or not',flash),
   modeBtn('mem','🧠','Memory Pairs','1 or 2 players',memMenu),
   modeBtn('build','🧩','Build the Line','Put the Gemara\'s words in order',build,true)),
  el('div',{class:'sec',text:'⚖️ The Sugya'}),
  el('div',{class:'grid'},
   modeBtn('cases','🐄','Who Pays?','You are the dayan. Rule on the case',()=>runCases()),
   modeBtn('said','🗣️','Who Said It?','Match the opinion to the Chacham',()=>runSaid()),
   modeBtn('korban','🔥','Chatat or Asham?','Rabbi Yirmeya\'s four cases',()=>runKorban()),
   modeBtn('cow','🏓','Cow Ping-Pong','Rabbi Zeira\'s 100-90-80-70',cow),
   modeBtn('exam','🎓','The Bechina','15 mixed questions. No hints. Get a grade.',exam,true)),
  el('button',{class:'btn alt',text:'📖 Word list & progress',onclick:wordList}),
  el('button',{class:'btn alt',text:(S.sound?'🔊 Sound on':'🔇 Sound off'),onclick:()=>{S.sound=!S.sound;save();home()}}))}

/* ---------- RESULTS ---------- */
